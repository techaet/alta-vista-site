name: Deploy (build + rsync para a VPS)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Checar tipos
        run: pnpm run check

      - name: Gerar build de produção
        run: pnpm run build

      - name: Enviar dist/public por rsync para a VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # sem --delete: o servidor só aceita escrita (rrsync -wo -no-del), como o FTP fazia na prática
          rsync -rlptz --chmod=D755,F644 -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" ./dist/public/ deploy@189.24.7.25:./
